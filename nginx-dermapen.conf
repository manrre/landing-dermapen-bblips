# --- dermapen.esteticaybellezafia.com ---
server {
    listen 80;
    server_name www.dermapen.esteticaybellezafia.com;
    return 301 $scheme://dermapen.esteticaybellezafia.com$request_uri;
}

server {
    listen 80;
    server_name dermapen.esteticaybellezafia.com;

    root /code;
    index index.html;

    # API calls → Node.js backend (port 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hotmart redirects → Node.js backend
    location /go/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # Health check → Node.js backend
    location /health {
        proxy_pass http://127.0.0.1:3001;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }
}
